<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talento Conecta</title>
    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- ================= PANTALLA DE LOGIN ================= -->
        <section id="login-view" class="screen active">
            
            <div class="logo-container">
                <!-- 1. ESPACIO PARA LA IMAGEN DEL ICONO (El pulpo / nodos) -->
                <img src="Logo_talento_conecta_todo1.png" alt="Logo talento conecta todo.png" class="logo-img-icon">
                
                
                
            </div>

            <div class="form-container">
                <h2 class="form-title">Inicia sesión</h2>
                <form id="login-form">
                    
                    <div class="input-group">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="email" placeholder="Correo electrónico" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" placeholder="Contraseña" required>
                        <i class="fa-regular fa-eye toggle-password"></i>
                    </div>
                    
                    <div class="options">
                        <!-- Checkbox personalizado -->
                        <label class="custom-checkbox">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            Recordarme
                        </label>
                        <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-primary">Iniciar sesión</button>
                </form>

                <div class="divider"><span>o continúa con</span></div>
                
                <div class="social-login">
                    <!-- Icono de Google Multicolor exacto -->
                    <button class="social-btn">
                        <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    </button>
                    <!-- Icono de Facebook -->
                    <button class="social-btn"><i class="fa-brands fa-facebook" style="color: #1877F2; font-size: 22px;"></i></button>
                    <!-- Icono de Apple -->
                    <button class="social-btn"><i class="fa-brands fa-apple" style="color: #000; font-size: 24px;"></i></button>
                    <!-- Icono de Correo -->
                    <button class="social-btn"><i class="fa-regular fa-envelope" style="color: #6B21A8; font-size: 22px;"></i></button>
                </div>

                <p class="register-link">¿No tienes cuenta?<br><a href="#">Regístrate aquí</a></p>
            </div>
        </section>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
